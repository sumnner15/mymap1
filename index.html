<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ 뮤지엄 패스포트 (Museum Passport)</title>
    <style>
        /* =========================================================
           1. 기본 디자인 & 색상 테마 (크림, 베이지, 세이지 그린)
           ========================================================= */
        :root {
            --bg-cream: #fdfbf7;
            --bg-card: #f8f5ee;
            --sidebar-bg: #faf7f2;
            --primary-green: #6b7a59;
            --primary-green-dark: #546243;
            --accent-warm: #d97757;
            --text-main: #3a3835;
            --text-sub: #736e65;
            --border-color: #e6e0d4;
            --stamp-teal: #008080; /* 청록색 원형 스탬프 색상 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-cream);
            color: var(--text-main);
        }

        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* =========================================================
           2. 왼쪽 사이드바 레이아웃 & 탭 메뉴
           ========================================================= */
        .sidebar {
            width: 420px;
            height: 100%;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.03);
            z-index: 10;
        }

        .header {
            padding: 24px 20px 16px 20px;
            background-color: var(--primary-green);
            color: #ffffff;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.85rem;
            margin-top: 6px;
            color: #e2e8dc;
        }

        /* 메인 네비게이션 탭 (탐색 / 찜 / 여권) */
        .main-nav {
            display: flex;
            background-color: #5d6b4d;
            border-bottom: 1px solid var(--border-color);
        }

        .main-nav-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: none;
            color: #d2dbca;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .main-nav-btn.active {
            background-color: var(--sidebar-bg);
            color: var(--primary-green-dark);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-weight: 700;
        }

        /* 컨트롤 영역 (검색창 + 카테고리 탭) */
        .controls-section {
            padding: 16px 20px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            background-color: #ffffff;
            color: var(--text-main);
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary-green);
        }

        .search-btn {
            padding: 10px 16px;
            background-color: var(--primary-green);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background-color: var(--primary-green-dark);
        }

        /* 문화시설 카테고리 4개 탭 */
        .category-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .cat-btn {
            padding: 8px 4px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #ffffff;
            color: var(--text-sub);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.2s;
        }

        .cat-btn.active {
            background-color: var(--primary-green);
            color: #ffffff;
            border-color: var(--primary-green);
        }

        /* 스크롤 결과 컨테이너 */
        .results-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        /* =========================================================
           3. 장소 카드 & 청록색 원형 아날로그 스탬프 디자인
           ========================================================= */
        .place-card {
            position: relative;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .place-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
            border-color: var(--primary-green);
        }

        .place-card.active {
            border-color: var(--primary-green);
            background-color: #f4f6f1;
        }

        .place-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            padding-right: 35px;
            margin-bottom: 4px;
        }

        .like-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .like-btn:hover {
            transform: scale(1.2);
        }

        .place-category {
            font-size: 0.78rem;
            color: var(--primary-green);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .place-address {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background-color: var(--primary-green);
            color: #ffffff;
            border-color: var(--primary-green);
        }

        .action-btn.danger {
            color: #d9534f;
        }

        .action-btn.danger:hover {
            background-color: #d9534f;
            color: #ffffff;
        }

        /* 💮 청록색 이중 원형 여권 도장 (아날로그 라이브 스탬프) */
        .stamp-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }

        .circle-stamp {
            width: 82px;
            height: 82px;
            border: 2px dashed var(--stamp-teal);
            border-radius: 50%;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-12deg);
            opacity: 0.88;
            background-color: rgba(0, 128, 128, 0.03);
        }

        .circle-stamp-inner {
            width: 100%;
            height: 100%;
            border: 1.5px solid var(--stamp-teal);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--stamp-teal);
            text-align: center;
            font-weight: 800;
        }

        .stamp-top-text {
            font-size: 0.5rem;
            letter-spacing: 0.5px;
        }

        .stamp-stars {
            font-size: 0.6rem;
            line-height: 1;
            margin: 1px 0;
        }

        .stamp-mid-text {
            font-size: 0.65rem;
            letter-spacing: 1px;
            font-weight: 900;
        }

        .stamp-date-text {
            font-size: 0.5rem;
            margin-top: 1px;
        }

        .passport-review-box {
            flex: 1;
            margin-right: 12px;
            padding: 10px 12px;
            background-color: var(--bg-card);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-main);
            border-left: 3px solid var(--primary-green);
        }

        .passport-review-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-green);
            margin-bottom: 4px;
        }

        .passport-date {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 6px;
            text-align: right;
        }

        /* =========================================================
           4. 오른쪽 지도 및 모달 레이아웃
           ========================================================= */
        .map-container {
            flex: 1;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .status-message {
            text-align: center;
            color: var(--text-sub);
            padding: 40px 10px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* 방문 후기 작성 모달 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #ffffff;
            width: 90%;
            max-width: 420px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
