<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ 뮤지엄 패스포트 (Museum Passport)</title>
    <style>
        /* =========================================================
           1. 기본 디자인 & 색상 테마 (크림, 베이지, 세이지 그린)
           ========================================================= */
        :root {
            --bg-cream: #fdfbf7;
            --bg-card: #f8f5ee;
            --sidebar-bg: #faf7f2;
            --primary-green: #6b7a59;
            --primary-green-dark: #546243;
            --accent-warm: #d97757;
            --text-main: #3a3835;
            --text-sub: #736e65;
            --border-color: #e6e0d4;
            --stamp-red: #c0392b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-cream);
            color: var(--text-main);
        }

        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* =========================================================
           2. 왼쪽 사이드바 레이아웃 & 탭 메뉴
           ========================================================= */
        .sidebar {
            width: 420px;
            height: 100%;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.03);
            z-index: 10;
        }

        .header {
            padding: 24px 20px 16px 20px;
            background-color: var(--primary-green);
            color: #ffffff;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.85rem;
            margin-top: 6px;
            color: #e2e8dc;
        }

        /* 메인 네비게이션 탭 (탐색 / 찜 / 여권) */
        .main-nav {
            display: flex;
            background-color: #5d6b4d;
            border-bottom: 1px solid var(--border-color);
        }

        .main-nav-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: none;
            color: #d2dbca;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .main-nav-btn.active {
            background-color: var(--sidebar-bg);
            color: var(--primary-green-dark);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-weight: 700;
        }

        /* 컨트롤 영역 (검색창 + 카테고리 탭) */
        .controls-section {
            padding: 16px 20px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            background-color: #ffffff;
            color: var(--text-main);
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary-green);
        }

        .search-btn {
            padding: 10px 16px;
            background-color: var(--primary-green);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background-color: var(--primary-green-dark);
        }

        /* 문화시설 카테고리 4개 탭 */
        .category-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .cat-btn {
            padding: 8px 4px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #ffffff;
            color: var(--text-sub);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.2s;
        }

        .cat-btn.active {
            background-color: var(--primary-green);
            color: #ffffff;
            border-color: var(--primary-green);
        }

        /* 스크롤 결과 컨테이너 */
        .results-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        /* =========================================================
           3. 장소 카드 & 스탬프 디자인
           ========================================================= */
        .place-card {
            position: relative;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0
